
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tidak Tersedia</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #d9534f; }
        p { color: #555; line-height: 1.6; }
        .contact {
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aplikasi Dinonaktifkan</h1>
        <p>Mohon maaf, aplikasi ini saat ini sudah tidak tersedia atau telah dihentikan layanannya.</p>
        <p>Untuk informasi lebih lanjut, silakan hubungi developer terkait.</p>
        <div class="contact">Terima kasih atas pengertiannya.</div>
    </div>
</body>
</html>
